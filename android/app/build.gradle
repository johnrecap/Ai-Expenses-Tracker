plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id 'com.google.gms.google-services'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

def keyProperties = new Properties()
def keyPropertiesFile = rootProject.file("key.properties")
if (keyPropertiesFile.exists()) {
    keyPropertiesFile.withReader("UTF-8") { reader ->
        keyProperties.load(reader)
    }
}

def releaseSigningKeys = ["storeFile", "storePassword", "keyAlias", "keyPassword"]
def hasReleaseSigningConfig = releaseSigningKeys.every { key ->
    def value = keyProperties.getProperty(key)
    value != null && !value.trim().isEmpty()
}

def admobAndroidAppId = project.findProperty("admob.androidAppId") ?: localProperties.getProperty("admob.androidAppId")
if (admobAndroidAppId == null || admobAndroidAppId.trim().isEmpty()) {
    admobAndroidAppId = "ca-app-pub-3940256099942544~3347511713"
}

android {
    namespace = "com.saeeddevstudio.ai_expenses_tracker"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.saeeddevstudio.ai_expenses_tracker"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        manifestPlaceholders = [
            applicationName: "android.app.Application",
            admobApplicationId: admobAndroidAppId
        ]
    }

    signingConfigs {
        release {
            if (hasReleaseSigningConfig) {
                storeFile = rootProject.file(keyProperties.getProperty("storeFile"))
                storePassword = keyProperties.getProperty("storePassword")
                keyAlias = keyProperties.getProperty("keyAlias")
                keyPassword = keyProperties.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigningConfig) {
                signingConfig = signingConfigs.release
            }
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    def releaseTasks = [
        "assembleRelease",
        "bundleRelease",
        "packageRelease",
        "installRelease"
    ]
    def isReleaseBuild = taskGraph.allTasks.any { task ->
        releaseTasks.any { releaseTask -> task.name == releaseTask || task.name.endsWith(releaseTask) }
    }

    if (isReleaseBuild && !hasReleaseSigningConfig) {
        throw new GradleException(
            "Release signing is not configured. Copy android/key.properties.example to android/key.properties " +
            "and set storeFile, storePassword, keyAlias, and keyPassword. Debug and profile builds do not require this file."
        )
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
