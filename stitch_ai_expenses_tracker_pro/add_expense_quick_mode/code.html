<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Add Expense - Quick Mode</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface": "#f7f9fb",
                        "on-primary": "#ffffff",
                        "primary-fixed-dim": "#00daf3",
                        "on-secondary-fixed": "#3f0018",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed-variant": "#004f58",
                        "on-surface-variant": "#3b494c",
                        "on-tertiary-fixed": "#20005f",
                        "on-error-container": "#93000a",
                        "primary-fixed": "#9cf0ff",
                        "on-primary-container": "#00626e",
                        "surface-bright": "#f7f9fb",
                        "surface-container": "#eceef0",
                        "tertiary-fixed-dim": "#cdbdff",
                        "surface-container-low": "#f2f4f6",
                        "on-background": "#191c1e",
                        "inverse-surface": "#2d3133",
                        "primary-container": "#00e5ff",
                        "secondary-container": "#dd2269",
                        "tertiary-container": "#d6c9ff",
                        "inverse-on-surface": "#eff1f3",
                        "outline": "#6b7a7d",
                        "on-primary-fixed": "#001f24",
                        "tertiary": "#6833ea",
                        "primary": "#006875",
                        "on-tertiary-fixed-variant": "#4f00d0",
                        "on-tertiary-container": "#622be5",
                        "surface-tint": "#006875",
                        "error": "#ba1a1a",
                        "on-secondary": "#ffffff",
                        "outline-variant": "#bac9cc",
                        "on-surface": "#191c1e",
                        "surface-dim": "#d8dadc",
                        "background": "#f7f9fb",
                        "on-secondary-fixed-variant": "#8f003f",
                        "error-container": "#ffdad6",
                        "secondary-fixed-dim": "#ffb1c1",
                        "surface-variant": "#e0e3e5",
                        "surface-container-highest": "#e0e3e5",
                        "surface-container-high": "#e6e8ea",
                        "tertiary-fixed": "#e8deff",
                        "on-secondary-container": "#fffbff",
                        "secondary": "#b70052",
                        "on-error": "#ffffff",
                        "secondary-fixed": "#ffd9df",
                        "inverse-primary": "#00daf3",
                        "surface-container-lowest": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xl": "32px",
                        "card-gutter": "12px",
                        "sm": "8px",
                        "lg": "24px",
                        "md": "16px",
                        "xs": "4px",
                        "unit": "4px",
                        "container-padding": "20px"
                    },
                    "fontFamily": {
                        "display-lg": ["Inter"],
                        "display-lg-mobile": ["Inter"],
                        "headline-md": ["Inter"],
                        "arabic-body": ["IBM Plex Sans Arabic"],

                    },
                    "fontSize": {
                        "display-lg": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "display-lg-mobile": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "arabic-body": ["16px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }]
                    }
                },
            },
        }
    </script>
<style>
        body {
            background-color: #f7f9fb;
            background-image: 
                radial-gradient(at 0% 0%, hsla(186,100%,50%,0.05) 0px, transparent 50%),
                radial-gradient(at 100% 0%, hsla(339,100%,46%,0.05) 0px, transparent 50%);
            background-attachment: fixed;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-surface pb-32">
<!-- Top App Bar - Linear/Transactional Page, so replacing standard top app bar with a contextual back/close header -->
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl border-b border-white/40 shadow-sm flex items-center justify-between px-container-padding h-16 transition-opacity">
<button class="p-2 -ml-2 rounded-full hover:bg-surface-variant/50 transition-colors text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary font-bold">Add Expense</h1>
<div class="w-10"></div> <!-- Placeholder for balance -->
</header>
<main class="pt-24 px-container-padding max-w-2xl mx-auto flex flex-col gap-xl">
<!-- Segmented Control -->
<div class="glass-panel rounded-full p-1 flex relative shadow-sm">
<div class="absolute inset-y-1 left-1 w-[calc(33.333%-4px)] bg-white rounded-full shadow-sm transition-transform duration-300" id="segment-indicator"></div>
<button class="flex-1 py-2 font-body-sm text-body-sm font-semibold z-10 text-primary transition-colors text-center" onclick="moveIndicator(0, this)">Quick</button>
<button class="flex-1 py-2 font-body-sm text-body-sm font-medium z-10 text-on-surface-variant transition-colors text-center" onclick="moveIndicator(1, this)">Text</button>
<button class="flex-1 py-2 font-body-sm text-body-sm font-medium z-10 text-on-surface-variant transition-colors text-center" onclick="moveIndicator(2, this)">Receipt</button>
</div>
<!-- Amount Input -->
<div class="flex flex-col items-center justify-center py-lg">
<span class="font-body-sm text-body-sm text-on-surface-variant mb-xs">Amount</span>
<div class="flex items-baseline gap-xs">
<span class="font-headline-md text-headline-md text-on-surface-variant">$</span>
<input class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg bg-transparent border-none text-center p-0 m-0 w-full max-w-[200px] text-primary focus:ring-0 focus:outline-none placeholder-outline-variant transition-all duration-800 ease-in-out" id="amount-input" type="text" value="0.00"/>
</div>
<div class="h-px w-32 bg-gradient-to-r from-transparent via-primary-container to-transparent mt-sm opacity-50"></div>
</div>
<!-- Category Selector -->
<section>
<h2 class="font-body-sm text-body-sm text-on-surface-variant mb-sm px-2">Category</h2>
<div class="flex flex-wrap gap-sm">
<button class="glass-panel px-md py-2 rounded-full font-body-sm text-body-sm flex items-center gap-xs text-primary ring-1 ring-primary-container bg-white/90">
<span class="material-symbols-outlined text-[18px]" data-icon="restaurant">restaurant</span> Food
                </button>
<button class="glass-panel px-md py-2 rounded-full font-body-sm text-body-sm flex items-center gap-xs text-on-surface hover:bg-white/50 transition-colors">
<span class="material-symbols-outlined text-[18px]" data-icon="directions_car">directions_car</span> Transport
                </button>
<button class="glass-panel px-md py-2 rounded-full font-body-sm text-body-sm flex items-center gap-xs text-on-surface hover:bg-white/50 transition-colors">
<span class="material-symbols-outlined text-[18px]" data-icon="shopping_bag">shopping_bag</span> Shopping
                </button>
<button class="glass-panel px-md py-2 rounded-full font-body-sm text-body-sm flex items-center gap-xs text-on-surface hover:bg-white/50 transition-colors">
<span class="material-symbols-outlined text-[18px]" data-icon="home">home</span> Home
                </button>
<button class="glass-panel px-md py-2 rounded-full font-body-sm text-body-sm flex items-center gap-xs text-on-surface hover:bg-white/50 transition-colors">
<span class="material-symbols-outlined text-[18px]" data-icon="more_horiz">more_horiz</span> More
                </button>
</div>
</section>
<!-- Selectors -->
<div class="grid grid-cols-2 gap-md">
<!-- Payment Method -->
<section class="glass-panel rounded-xl p-md flex flex-col gap-sm">
<span class="font-body-sm text-body-sm text-on-surface-variant">Payment Method</span>
<div class="flex items-center justify-between">
<div class="flex items-center gap-xs">
<div class="w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined text-[16px]" data-icon="credit_card">credit_card</span>
</div>
<span class="font-body-lg text-body-lg font-medium">Card</span>
</div>
<span class="material-symbols-outlined text-outline-variant" data-icon="expand_more">expand_more</span>
</div>
</section>
<!-- Currency -->
<section class="glass-panel rounded-xl p-md flex flex-col gap-sm">
<span class="font-body-sm text-body-sm text-on-surface-variant">Currency</span>
<div class="flex items-center justify-between">
<div class="flex items-center gap-xs">
<div class="w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant font-bold">
                            $
                        </div>
<span class="font-body-lg text-body-lg font-medium">USD</span>
</div>
<span class="material-symbols-outlined text-outline-variant" data-icon="expand_more">expand_more</span>
</div>
</section>
</div>
</main>
<!-- Bottom Sticky Action -->
<div class="fixed bottom-0 left-0 w-full p-container-padding bg-gradient-to-t from-surface via-surface/90 to-transparent z-40 pb-safe">
<button class="w-full max-w-2xl mx-auto block rounded-full py-4 bg-gradient-to-r from-primary-container to-tertiary-container text-on-primary-container font-headline-md text-body-lg shadow-[0_4px_14px_0_rgba(0,229,255,0.39)] hover:shadow-[0_6px_20px_rgba(0,229,255,0.23)] hover:-translate-y-0.5 transition-all duration-300">
            Save Expense
        </button>
</div>
<script>
        function moveIndicator(index, element) {
            const indicator = document.getElementById('segment-indicator');
            const buttons = element.parentElement.querySelectorAll('button');
            
            indicator.style.transform = `translateX(${index * 100}%)`;
            
            buttons.forEach(btn => {
                btn.classList.remove('text-primary', 'font-semibold');
                btn.classList.add('text-on-surface-variant', 'font-medium');
            });
            
            element.classList.remove('text-on-surface-variant', 'font-medium');
            element.classList.add('text-primary', 'font-semibold');
        }

        // Simple animate in for amount
        document.addEventListener('DOMContentLoaded', () => {
            const input = document.getElementById('amount-input');
            setTimeout(() => {
                input.value = "42.50";
                // In a real app, use a proper easing function for number count up
            }, 100);
        });
    </script>
</body></html>
