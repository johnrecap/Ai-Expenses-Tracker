<!DOCTYPE html>

<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.05);
        }
        
        .chip-active {
            background: linear-gradient(90deg, #00daf3 0%, #006875 100%);
            color: #ffffff;
            border-color: transparent;
        }

        .chip-inactive {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(107, 122, 125, 0.2);
            color: #3b494c;
        }

        /* Range Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #00daf3;
            cursor: pointer;
            margin-top: -10px;
            box-shadow: 0 0 10px rgba(0, 218, 243, 0.5);
            border: 2px solid #ffffff;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #e0e3e5;
            border-radius: 2px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body-lg min-h-screen relative overflow-hidden">
<!-- Blurred Background Context (Simulating the underlying screen) -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-40">
<div class="absolute top-0 left-0 w-full h-full bg-surface"></div>
<div class="absolute top-20 left-10 w-64 h-64 bg-primary/10 rounded-full blur-3xl"></div>
<div class="absolute bottom-40 right-10 w-72 h-72 bg-secondary/10 rounded-full blur-3xl"></div>
</div>
<!-- Top Navigation Anchor (Inactive context) -->
<header class="fixed top-0 w-full z-10 flex items-center justify-between px-container-padding h-16 w-full bg-surface/80 backdrop-blur-xl border-b border-white/40 shadow-sm opacity-50 pointer-events-none">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-on-surface-variant">menu</span>
</div>
<h1 class="font-headline-md text-headline-md text-primary">AI Expenses Tracker</h1>
<div class="w-8 h-8 rounded-full bg-surface-variant overflow-hidden">
<img alt="Avatar placeholder" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCV3TjZfY-anban7iwkx9CRP7J31YeZuwO8EQxPvC9gz-37uTs3qaicWIdPpupz_D1Y_DBZOWeNVULECI5XvSolHIfQJtmCSBJ3-V74hC8VY4iU56HFnhA3oJNIfoU0_LEqjQ4i75-vzjbBcHczcoWg-qoY8RYs-_Dtrwu8bm2TKCWn5kgqtq09fhMKVhD0hyE-3fJN6vT8p38NUIGZuL5vzVJmVxgUrW3mPJevVfJAFEOQoflJ3EHAcJrRvbIPnP-EO8FxU0xxdb8n"/>
</div>
</header>
<!-- Overlay -->
<div class="fixed inset-0 bg-on-background/20 backdrop-blur-sm z-40 transition-opacity" id="scrim"></div>
<!-- Bottom Sheet -->
<div class="fixed bottom-0 left-0 w-full glass-panel rounded-t-[32px] z-50 flex flex-col max-h-[795px] transition-transform duration-500 ease-out transform translate-y-0" id="filterSheet">
<!-- Drag Handle -->
<div class="w-full flex justify-center pt-sm pb-md cursor-grab">
<div class="w-12 h-1.5 bg-outline-variant/50 rounded-full"></div>
</div>
<!-- Header -->
<div class="px-container-padding pb-md flex justify-between items-center border-b border-white/30">
<h2 class="font-headline-md text-headline-md text-primary">Filters</h2>
<button class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-surface-variant/50 transition-colors text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Scrollable Content -->
<div class="px-container-padding py-lg overflow-y-auto flex flex-col gap-xl scrollbar-hide">
<!-- Search -->
<div class="flex flex-col gap-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Search</label>
<div class="relative w-full">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">search</span>
</div>
<input class="w-full pl-12 pr-md py-sm bg-[#F1F5F9] border-none rounded-full font-body-lg text-on-surface placeholder:text-outline focus:ring-1 focus:ring-primary-container focus:bg-white transition-colors h-12 shadow-inner" placeholder="Search expenses..." type="text"/>
</div>
</div>
<!-- Date Range -->
<div class="flex flex-col gap-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Date Range</label>
<div class="flex gap-sm">
<div class="relative flex-1">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]">calendar_today</span>
</div>
<input class="w-full pl-10 pr-sm py-sm bg-[#F1F5F9] border-none rounded-lg font-body-sm text-on-surface focus:ring-1 focus:ring-primary-container focus:bg-white transition-colors h-10 shadow-inner" type="text" value="Oct 1, 2023"/>
</div>
<div class="flex items-center text-outline-variant">-</div>
<div class="relative flex-1">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]">calendar_today</span>
</div>
<input class="w-full pl-10 pr-sm py-sm bg-[#F1F5F9] border-none rounded-lg font-body-sm text-on-surface focus:ring-1 focus:ring-primary-container focus:bg-white transition-colors h-10 shadow-inner" type="text" value="Oct 31, 2023"/>
</div>
</div>
</div>
<!-- Categories -->
<div class="flex flex-col gap-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Categories</label>
<div class="flex flex-wrap gap-sm">
<button class="px-md py-xs rounded-full font-body-sm chip-active flex items-center gap-xs shadow-sm transition-transform active:scale-95">
<span class="material-symbols-outlined text-[16px]">restaurant</span> Dining
                    </button>
<button class="px-md py-xs rounded-full font-body-sm chip-inactive flex items-center gap-xs transition-transform active:scale-95">
<span class="material-symbols-outlined text-[16px]">shopping_cart</span> Groceries
                    </button>
<button class="px-md py-xs rounded-full font-body-sm chip-active flex items-center gap-xs shadow-sm transition-transform active:scale-95">
<span class="material-symbols-outlined text-[16px]">directions_car</span> Transport
                    </button>
<button class="px-md py-xs rounded-full font-body-sm chip-inactive flex items-center gap-xs transition-transform active:scale-95">
<span class="material-symbols-outlined text-[16px]">home</span> Housing
                    </button>
<button class="px-md py-xs rounded-full font-body-sm chip-inactive flex items-center gap-xs transition-transform active:scale-95">
<span class="material-symbols-outlined text-[16px]">movie</span> Entertainment
                    </button>
</div>
</div>
<!-- Amount Range -->
<div class="flex flex-col gap-sm">
<div class="flex justify-between items-end">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Amount Range</label>
<span class="font-body-sm text-primary font-semibold">$0 - $5,000+</span>
</div>
<div class="pt-sm pb-md">
<input class="w-full" id="amountRange" max="5000" min="0" type="range" value="1500"/>
</div>
</div>
<!-- Spacer for bottom buttons -->
<div class="h-10"></div>
</div>
<!-- Sticky Bottom Actions -->
<div class="px-container-padding py-md bg-surface/50 backdrop-blur-md border-t border-white/40 flex gap-md items-center justify-between mt-auto pb-safe">
<button class="flex-1 py-sm px-lg rounded-full bg-[rgba(0,229,255,0.1)] text-primary font-body-lg font-semibold hover:bg-[rgba(0,229,255,0.2)] transition-colors">
                Reset
            </button>
<button class="flex-[2] py-sm px-lg rounded-full bg-gradient-to-r from-[#00daf3] to-[#006875] text-white font-body-lg font-semibold shadow-[0_4px_14px_rgba(0,218,243,0.3)] hover:shadow-[0_6px_20px_rgba(0,218,243,0.4)] transition-all active:scale-95">
                Apply Filters
            </button>
</div>
</div>
<!-- Suppressed Nav Shell context -->
<div class="hidden">
<!-- The shell is suppressed because this is a contextual bottom sheet overlay -->
</div>
<script>
        // Simple slide-in animation on load
        document.addEventListener('DOMContentLoaded', () => {
            const sheet = document.getElementById('filterSheet');
            const scrim = document.getElementById('scrim');
            
            // Start state
            sheet.style.transform = 'translateY(100%)';
            scrim.style.opacity = '0';
            
            // Animate in
            requestAnimationFrame(() => {
                sheet.style.transform = 'translateY(0)';
                scrim.style.opacity = '1';
            });
        });
    </script>
</body></html>
