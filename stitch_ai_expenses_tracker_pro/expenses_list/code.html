<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AI Expenses Tracker - Expenses List</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=IBM+Plex+Sans+Arabic:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface": "#f7f9fb",
                        "on-primary": "#ffffff",
                        "primary-fixed-dim": "#00daf3",
                        "on-secondary-fixed": "#3f0018",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed-variant": "#004f58",
                        "on-surface-variant": "#3b494c",
                        "on-tertiary-fixed": "#20005f",
                        "on-error-container": "#93000a",
                        "primary-fixed": "#9cf0ff",
                        "on-primary-container": "#00626e",
                        "surface-bright": "#f7f9fb",
                        "surface-container": "#eceef0",
                        "tertiary-fixed-dim": "#cdbdff",
                        "surface-container-low": "#f2f4f6",
                        "on-background": "#191c1e",
                        "inverse-surface": "#2d3133",
                        "primary-container": "#00e5ff",
                        "secondary-container": "#dd2269",
                        "tertiary-container": "#d6c9ff",
                        "inverse-on-surface": "#eff1f3",
                        "outline": "#6b7a7d",
                        "on-primary-fixed": "#001f24",
                        "tertiary": "#6833ea",
                        "primary": "#006875",
                        "on-tertiary-fixed-variant": "#4f00d0",
                        "on-tertiary-container": "#622be5",
                        "surface-tint": "#006875",
                        "error": "#ba1a1a",
                        "on-secondary": "#ffffff",
                        "outline-variant": "#bac9cc",
                        "on-surface": "#191c1e",
                        "surface-dim": "#d8dadc",
                        "background": "#f7f9fb",
                        "on-secondary-fixed-variant": "#8f003f",
                        "error-container": "#ffdad6",
                        "secondary-fixed-dim": "#ffb1c1",
                        "surface-variant": "#e0e3e5",
                        "surface-container-highest": "#e0e3e5",
                        "surface-container-high": "#e6e8ea",
                        "tertiary-fixed": "#e8deff",
                        "on-secondary-container": "#fffbff",
                        "secondary": "#b70052",
                        "on-error": "#ffffff",
                        "secondary-fixed": "#ffd9df",
                        "inverse-primary": "#00daf3",
                        "surface-container-lowest": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xl": "32px",
                        "card-gutter": "12px",
                        "sm": "8px",
                        "lg": "24px",
                        "md": "16px",
                        "xs": "4px",
                        "unit": "4px",
                        "container-padding": "20px"
                    },
                    "fontFamily": {
                        "display-lg": ["Inter"],
                        "display-lg-mobile": ["Inter"],
                        "headline-md": ["Inter"],
                        "arabic-body": ["IBM Plex Sans Arabic"],
                        "body-lg": ["Inter"],
                        "body-sm": ["Inter"],
                        "label-caps": ["Inter"]
                    },
                    "fontSize": {
                        "display-lg": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "display-lg-mobile": ["32px", {"lineHeight": "40px", "fontWeight": "700"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "arabic-body": ["16px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}]
                    }
                }
            }
        }
    </script>
<style>
        .glass-card {
            background: linear-gradient(180deg, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0.4) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.4);
            box-shadow: 0 8px 32px rgba(0,0,0,0.05);
        }
        .bg-blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.1;
            z-index: -1;
        }
        .anim-slide-up {
            animation: slideUp 0.6s cubic-bezier(0.23, 1, 0.32, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body-lg min-h-screen relative overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- Background Blobs Layer 0 -->
<div class="bg-blob w-[500px] h-[500px] bg-primary -top-40 -left-40"></div>
<div class="bg-blob w-[400px] h-[400px] bg-secondary top-1/2 -right-20"></div>
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl border-b border-white/40 shadow-sm">
<div class="flex items-center justify-between px-container-padding h-16 w-full">
<button class="text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary truncate">AI Expenses Tracker</h1>
<button class="text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="account_circle" style="font-variation-settings: 'FILL' 1;">account_circle</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="pt-24 pb-28 px-container-padding max-w-3xl mx-auto flex flex-col gap-lg">
<!-- Search and Filters Area -->
<section class="flex flex-col gap-sm anim-slide-up" style="animation-delay: 0.1s;">
<!-- Search Bar -->
<div class="relative w-full">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant z-10 pointer-events-none" data-icon="search">search</span>
<input class="w-full h-12 pl-12 pr-4 bg-[#F1F5F9] rounded-full border-transparent focus:bg-white focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all font-body-lg placeholder:text-on-surface-variant/60 shadow-inner" placeholder="Search transactions..." type="text"/>
</div>
<!-- Filter Chips (Horizontal Scroll) -->
<div class="flex gap-sm overflow-x-auto pb-2 scrollbar-hide -mx-container-padding px-container-padding snap-x">
<button class="snap-start shrink-0 flex items-center gap-xs px-md py-2 rounded-full bg-primary-container text-on-primary-container font-label-caps text-label-caps shadow-sm">
<span class="material-symbols-outlined text-[16px]" data-icon="calendar_today">calendar_today</span>
                    This Month
                </button>
<button class="snap-start shrink-0 flex items-center gap-xs px-md py-2 rounded-full bg-white/60 border border-white/40 text-on-surface-variant font-label-caps text-label-caps hover:bg-white transition-colors backdrop-blur-sm">
<span class="material-symbols-outlined text-[16px]" data-icon="category">category</span>
                    Category
                </button>
<button class="snap-start shrink-0 flex items-center gap-xs px-md py-2 rounded-full bg-white/60 border border-white/40 text-on-surface-variant font-label-caps text-label-caps hover:bg-white transition-colors backdrop-blur-sm">
<span class="material-symbols-outlined text-[16px]" data-icon="payments">payments</span>
                    Amount
                </button>
<button class="snap-start shrink-0 flex items-center gap-xs px-md py-2 rounded-full bg-white/60 border border-white/40 text-on-surface-variant font-label-caps text-label-caps hover:bg-white transition-colors backdrop-blur-sm">
<span class="material-symbols-outlined text-[16px]" data-icon="tune">tune</span>
                    More Filters
                </button>
</div>
</section>
<!-- Transactions List -->
<section class="flex flex-col gap-xs">
<h2 class="font-body-sm text-body-sm text-on-surface-variant mb-xs ml-xs anim-slide-up" style="animation-delay: 0.15s;">Today, Oct 24</h2>
<div class="glass-card rounded-xl p-xs flex flex-col gap-[2px] overflow-hidden anim-slide-up" style="animation-delay: 0.2s;">
<!-- Transaction Row 1 -->
<div class="flex items-center justify-between p-sm rounded-lg hover:bg-white/50 transition-colors cursor-pointer group">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-secondary-container/20 flex items-center justify-center text-secondary">
<span class="material-symbols-outlined" data-icon="restaurant">restaurant</span>
</div>
<div class="flex flex-col">
<span class="font-body-lg text-on-surface font-semibold">Crave Restaurant</span>
<span class="font-body-sm text-on-surface-variant">Dining</span>
</div>
</div>
<div class="flex flex-col items-end">
<span class="font-headline-md text-headline-md text-on-surface">- EGP 1,450</span>
<span class="material-symbols-outlined text-[14px] text-primary animate-[spin_3s_linear_infinite]" data-icon="sync" title="Syncing">sync</span>
</div>
</div>
<!-- Transaction Row 2 -->
<div class="flex items-center justify-between p-sm rounded-lg hover:bg-white/50 transition-colors cursor-pointer group">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-tertiary-container/20 flex items-center justify-center text-tertiary">
<span class="material-symbols-outlined" data-icon="local_taxi">local_taxi</span>
</div>
<div class="flex flex-col">
<span class="font-body-lg text-on-surface font-semibold">Uber Trip</span>
<span class="font-body-sm text-on-surface-variant">Transport</span>
</div>
</div>
<div class="flex flex-col items-end">
<span class="font-headline-md text-headline-md text-on-surface">- EGP 120</span>
<span class="material-symbols-outlined text-[14px] text-outline" data-icon="cloud_done" title="Synced">cloud_done</span>
</div>
</div>
</div>
<h2 class="font-body-sm text-body-sm text-on-surface-variant mt-sm mb-xs ml-xs anim-slide-up" style="animation-delay: 0.25s;">Yesterday, Oct 23</h2>
<div class="glass-card rounded-xl p-xs flex flex-col gap-[2px] overflow-hidden anim-slide-up" style="animation-delay: 0.3s;">
<!-- Transaction Row 3 -->
<div class="flex items-center justify-between p-sm rounded-lg hover:bg-white/50 transition-colors cursor-pointer group">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-primary-container/20 flex items-center justify-center text-primary">
<span class="material-symbols-outlined" data-icon="shopping_bag">shopping_bag</span>
</div>
<div class="flex flex-col">
<span class="font-body-lg text-on-surface font-semibold">Carrefour</span>
<span class="font-body-sm text-on-surface-variant">Groceries</span>
</div>
</div>
<div class="flex flex-col items-end">
<span class="font-headline-md text-headline-md text-on-surface">- EGP 3,200</span>
<span class="material-symbols-outlined text-[14px] text-outline" data-icon="cloud_done">cloud_done</span>
</div>
</div>
<!-- Transaction Row 4 -->
<div class="flex items-center justify-between p-sm rounded-lg hover:bg-white/50 transition-colors cursor-pointer group">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-primary-fixed/20 flex items-center justify-center text-primary-fixed-dim">
<span class="material-symbols-outlined" data-icon="payments">payments</span>
</div>
<div class="flex flex-col">
<span class="font-body-lg text-on-surface font-semibold">Salary Deposit</span>
<span class="font-body-sm text-on-surface-variant">Income</span>
</div>
</div>
<div class="flex flex-col items-end">
<span class="font-headline-md text-headline-md text-primary">+ EGP 15,000</span>
<span class="material-symbols-outlined text-[14px] text-outline" data-icon="cloud_done">cloud_done</span>
</div>
</div>
</div>
</section>
</main>
<!-- Floating Action Button (FAB) - Suppressed as per instructions for 'Expenses List' but user requested it in prompt, resolving to include based on user prompt 'Includes a floating "+" button' over general rule if conflicting, though usually list implies adding new -->
<button class="fixed right-container-padding bottom-28 w-14 h-14 rounded-full bg-gradient-to-r from-[#00daf3] to-[#00e5ff] text-white flex items-center justify-center shadow-[0_8px_24px_rgba(0,229,255,0.4)] hover:shadow-[0_12px_32px_rgba(0,229,255,0.6)] hover:-translate-y-1 active:translate-y-0 active:scale-95 transition-all duration-300 z-40">
<span class="material-symbols-outlined text-3xl drop-shadow-md" data-icon="add">add</span>
</button>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full rounded-t-xl z-50 bg-surface/80 backdrop-blur-2xl border-t border-white/40 shadow-[0_-4px_20px_rgba(0,0,0,0.05)] md:hidden">
<div class="flex justify-around items-center h-20 px-4 pb-safe w-full">
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-primary/5 rounded-full transition-all duration-300 ease-quintOut p-2">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label-caps text-label-caps mt-1">Home</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-primary/5 rounded-full transition-all duration-300 ease-quintOut p-2">
<span class="material-symbols-outlined" data-icon="query_stats">query_stats</span>
<span class="font-label-caps text-label-caps mt-1">Insights</span>
</button>
<button class="flex flex-col items-center justify-center text-primary font-bold hover:bg-primary/5 rounded-full transition-all duration-300 ease-quintOut p-2 relative">
<!-- Highlight for active state -->
<div class="absolute inset-0 bg-primary/10 rounded-full scale-110 -z-10"></div>
<span class="material-symbols-outlined" data-icon="add" style="font-variation-settings: 'FILL' 1;">add</span>
<span class="font-label-caps text-label-caps mt-1">Add</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-primary/5 rounded-full transition-all duration-300 ease-quintOut p-2">
<span class="material-symbols-outlined" data-icon="account_balance_wallet">account_balance_wallet</span>
<span class="font-label-caps text-label-caps mt-1">Budgets</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-primary/5 rounded-full transition-all duration-300 ease-quintOut p-2">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-label-caps text-label-caps mt-1">Settings</span>
</button>
</div>
</nav>
</body></html>
