<!-- Script for subtle interaction -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const previewValue = document.getElementById('preview-value');
            const targetValue = 485.50;
            let current = 0;
            const duration = 800; // ms
            const fps = 60;
            const frames = duration / (1000 / fps);
            const increment = targetValue / frames;

            function easeQuintOut(t) {
                return 1 - Math.pow(1 - t, 5);
            }

            let start = null;
            function animate(timestamp) {
                if (!start) start = timestamp;
                let progress = timestamp - start;
                let percent = Math.min(progress / duration, 1);
                
                let easedPercent = easeQuintOut(percent);
                let displayValue = (targetValue * easedPercent).toFixed(2);
                
                previewValue.textContent = displayValue;

                if (progress < duration) {
                    window.requestAnimationFrame(animate);
                } else {
                    previewValue.textContent = targetValue.toFixed(2);
                }
            }
            window.requestAnimationFrame(animate);
        });
    </script>
