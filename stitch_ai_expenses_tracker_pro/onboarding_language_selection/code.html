<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.05);
        }
        .bg-blob {
            position: absolute;
            filter: blur(60px);
            opacity: 0.1;
            z-index: -1;
            border-radius: 50%;
        }
        .gradient-text {
            background: linear-gradient(to right, #00daf3, #006875);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .btn-gradient {
            background: linear-gradient(to right, #00daf3, #006875);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body-lg min-h-screen relative overflow-hidden flex flex-col items-center justify-center">
<!-- Background Blobs -->
<div class="bg-blob w-96 h-96 bg-primary-container top-[-10%] left-[-10%]"></div>
<div class="bg-blob w-96 h-96 bg-secondary-container bottom-[-10%] right-[-10%]"></div>
<main class="w-full max-w-md px-container-padding flex flex-col h-screen md:h-auto md:min-h-[600px] z-10 relative">
<!-- Header -->
<header class="pt-12 pb-8 flex flex-col items-center text-center">
<div class="w-16 h-16 rounded-full glass-panel flex items-center justify-center mb-6 text-primary">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">language</span>
</div>
<h1 class="font-headline-md text-headline-md mb-2">Choose your app language</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">You can always change this later in settings.</p>
</header>
<!-- Language Selection Cards -->
<div class="flex-grow flex flex-col gap-4 mt-4">
<!-- English Card (Active State) -->
<button class="w-full text-left glass-panel rounded-xl p-6 relative overflow-hidden transition-all duration-300 transform active:scale-95 border-primary ring-2 ring-primary bg-white/80 shadow-[0_4px_20px_rgba(0,104,117,0.15)] group" onclick="selectLanguage('en')">
<div class="absolute inset-0 bg-gradient-to-br from-primary-fixed/20 to-transparent opacity-100"></div>
<div class="relative z-10 flex items-center justify-between">
<div>
<span class="block font-headline-md text-headline-md text-primary mb-1">English</span>
<span class="block font-body-sm text-body-sm text-on-surface-variant">United States</span>
</div>
<span class="material-symbols-outlined text-primary text-2xl" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</button>
<!-- Arabic Card -->
<button class="w-full text-right glass-panel rounded-xl p-6 relative overflow-hidden transition-all duration-300 transform active:scale-95 hover:bg-white/50 group" dir="rtl" onclick="selectLanguage('ar')">
<div class="absolute inset-0 bg-gradient-to-br from-surface-variant/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
<div class="relative z-10 flex items-center justify-between">
<div>
<span class="block font-arabic-body text-[28px] leading-[36px] font-bold text-on-surface mb-1">العربية</span>
<span class="block font-arabic-body text-body-sm text-on-surface-variant">الشرق الأوسط</span>
</div>
<span class="material-symbols-outlined text-outline-variant text-2xl group-hover:text-primary transition-colors">radio_button_unchecked</span>
</div>
</button>
</div>
<!-- Fixed Bottom Action -->
<div class="mt-auto pt-8 pb-safe md:pb-8 w-full">
<button class="w-full btn-gradient text-on-primary font-headline-md text-[18px] leading-[24px] py-4 rounded-full shadow-lg hover:opacity-90 active:scale-95 transition-all duration-200 flex items-center justify-center gap-2">
                Continue
                <span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
</div>
</main>
<script>
        // Simple visual toggle for demonstration
        function selectLanguage(lang) {
            const btns = document.querySelectorAll('button[onclick^="selectLanguage"]');
            btns.forEach(btn => {
                // Reset all
                btn.classList.remove('border-primary', 'ring-2', 'ring-primary', 'bg-white/80', 'shadow-[0_4px_20px_rgba(0,104,117,0.15)]');
                btn.classList.add('hover:bg-white/50');
                const icon = btn.querySelector('.material-symbols-outlined');
                if(icon) {
                    icon.textContent = 'radio_button_unchecked';
                    icon.classList.remove('text-primary');
                    icon.classList.add('text-outline-variant', 'group-hover:text-primary');
                    icon.style.fontVariationSettings = "'FILL' 0";
                }
                const title = btn.querySelector('span:first-child');
                if(title) {
                    title.classList.remove('text-primary');
                    title.classList.add('text-on-surface');
                }
            });

            // Set active
            const activeBtn = document.querySelector(`button[onclick="selectLanguage('${lang}')"]`);
            if (activeBtn) {
                activeBtn.classList.add('border-primary', 'ring-2', 'ring-primary', 'bg-white/80', 'shadow-[0_4px_20px_rgba(0,104,117,0.15)]');
                activeBtn.classList.remove('hover:bg-white/50');
                const icon = activeBtn.querySelector('.material-symbols-outlined');
                if(icon) {
                    icon.textContent = 'check_circle';
                    icon.classList.remove('text-outline-variant', 'group-hover:text-primary');
                    icon.classList.add('text-primary');
                    icon.style.fontVariationSettings = "'FILL' 1";
                }
                const title = activeBtn.querySelector('span:first-child');
                if(title) {
                    title.classList.remove('text-on-surface');
                    title.classList.add('text-primary');
                }
            }
        }
    </script>
</body></html>
