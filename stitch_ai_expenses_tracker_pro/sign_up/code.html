<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sign Up - AI Expenses Tracker</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }
    </style>

                        "on-tertiary-container": "#622be5",
                        "surface-tint": "#006875",
                        "error": "#ba1a1a",
                        "on-secondary": "#ffffff",
                        "outline-variant": "#bac9cc",

    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-surface text-on-surface font-body-lg min-h-screen relative overflow-x-hidden flex flex-col justify-center items-center p-container-padding">
<!-- Background Blobs -->
<div class="fixed inset-0 z-0 pointer-events-none overflow-hidden">
<div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] rounded-full bg-gradient-to-br from-primary/10 to-transparent blur-3xl"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[60%] h-[60%] rounded-full bg-gradient-to-tl from-secondary/10 to-transparent blur-3xl"></div>
</div>
<!-- Sign Up Card -->
<main class="w-full max-w-md relative z-10">
<div class="bg-white/70 backdrop-blur-xl border border-white/40 rounded-[24px] shadow-[0_8px_32px_rgba(0,0,0,0.04)] p-xl flex flex-col gap-lg">
<!-- Header -->
<div class="text-center space-y-sm">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-primary-container/20 text-primary mb-md">
<span class="material-symbols-outlined" data-icon="person_add" style="font-size: 32px;">person_add</span>
</div>
<h1 class="font-display-lg-mobile text-display-lg-mobile bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent">Create Account</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Join AI Expenses Tracker today.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-md">
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline" data-icon="person">person</span>
<input class="w-full bg-[#F1F5F9] border-none rounded-full py-3 pl-12 pr-4 font-body-lg text-body-lg text-on-surface placeholder:text-outline focus:ring-1 focus:ring-primary-container focus:bg-white transition-colors duration-200" placeholder="Full Name" required="" type="text"/>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline" data-icon="mail">mail</span>
<input class="w-full bg-[#F1F5F9] border-none rounded-full py-3 pl-12 pr-4 font-body-lg text-body-lg text-on-surface placeholder:text-outline focus:ring-1 focus:ring-primary-container focus:bg-white transition-colors duration-200" placeholder="Email Address" required="" type="email"/>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline" data-icon="lock">lock</span>
<input class="w-full bg-[#F1F5F9] border-none rounded-full py-3 pl-12 pr-4 font-body-lg text-body-lg text-on-surface placeholder:text-outline focus:ring-1 focus:ring-primary-container focus:bg-white transition-colors duration-200" placeholder="Password" required="" type="password"/>
</div>
<button class="w-full mt-sm py-3 rounded-full bg-gradient-to-r from-[#00daf3] to-[#006875] text-on-primary font-body-lg font-bold shadow-[0_1px_2px_rgba(0,0,0,0.1)] active:scale-95 transition-transform duration-200" type="submit">
                    Sign Up
                </button>
</form>
<div class="flex items-center gap-4 py-2">
<div class="h-px bg-outline-variant/30 flex-1"></div>
<span class="font-body-sm text-body-sm text-on-surface-variant">or</span>
<div class="h-px bg-outline-variant/30 flex-1"></div>
</div>
<!-- Google Sign Up -->
<button class="w-full py-3 rounded-full bg-[rgba(0,229,255,0.1)] text-[#006875] font-body-lg font-semibold flex items-center justify-center gap-2 active:scale-95 transition-transform duration-200 border border-transparent hover:border-[#00daf3]/30">
<svg class="w-5 h-5" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path></svg>
                Sign up with Google
            </button>
<!-- Footer Links -->
<div class="text-center space-y-sm">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Already have an account? <a class="text-primary hover:text-primary-fixed-dim transition-colors font-semibold" href="#">Log in</a>
</p>
<p class="font-label-caps text-label-caps text-on-surface-variant/70 mt-md">
                    By signing up, you agree to our <a class="underline hover:text-on-surface transition-colors" href="#">Terms</a> &amp; <a class="underline hover:text-on-surface transition-colors" href="#">Privacy Policy</a>.
                </p>
</div>
</div>
</main>
</body></html>
