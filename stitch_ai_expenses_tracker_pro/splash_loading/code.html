<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        
        .gradient-blob {
            position: absolute;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.15;
            animation: pulse-slow 4s infinite alternate;
        }
        
        .loading-ring {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(0, 229, 255, 0.1);
            border-radius: 50%;
            border-top-color: #00daf3;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-surface text-on-surface h-screen w-screen overflow-hidden flex flex-col items-center justify-center relative font-body-lg">
<!-- Background Depth -->
<div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
<div class="gradient-blob bg-primary-container w-[500px] h-[500px] rounded-full top-[-100px] left-[-100px]"></div>
<div class="gradient-blob bg-secondary-container w-[400px] h-[400px] rounded-full bottom-[-50px] right-[-50px]" style="animation-delay: 1s;"></div>
</div>
<!-- Main Content Canvas -->
<main class="z-10 flex flex-col items-center justify-center flex-1 w-full max-w-md px-container-padding relative">
<!-- Logo & Branding Cluster -->
<div class="flex flex-col items-center justify-center space-y-xl animate-float">
<!-- Glassmorphism Logo Container -->
<div class="glass-panel w-32 h-32 rounded-xl flex items-center justify-center shadow-lg relative overflow-hidden">
<!-- Inner glow -->
<div class="absolute inset-0 bg-gradient-to-br from-primary-container/20 to-transparent z-0"></div>
<img alt="AI Expenses Tracker Logo" class="w-24 h-24 object-contain z-10 relative drop-shadow-md" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD12iNr_kFX-mJNNTgTxxfEi6PYA5CC84hQozQgTFXrbWsNcDmn0RSqLroI8WGW-r69wptGkXhs5spJxZEACVtzv2dWI_o22tUTZt1tch3SjNcl7HvyzMKimGeaHvcvgeNIbkf4ab3OB7d8bQRmv8f-f4znmTB7jH7as0esqGrlissF4Ugb1bJS0cVgufwpycpZogCw1j8E_iX_JWBEJxWnfYqM8HhVqfk3tKZe8fs2Wi5-aSebIZmuEMvgQmczdxgwI3lwD3bwnqqZ"/>
</div>
<!-- Typography -->
<div class="text-center space-y-sm">
<h1 class="font-display-lg-mobile text-display-lg-mobile bg-gradient-to-r from-primary to-primary-fixed-dim bg-clip-text text-transparent pb-1">
                    AI Expenses Tracker
                </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant/80 tracking-wide">
                    Intelligent Financial Clarity
                </p>
</div>
</div>
<!-- Loading Indicator -->
<div class="absolute bottom-16 left-1/2 transform -translate-x-1/2 flex flex-col items-center space-y-md">
<div class="loading-ring"></div>
<span class="font-label-caps text-label-caps text-on-surface-variant/60 uppercase tracking-widest">Initializing AI Engine</span>
</div>
</main>
<script>
        // Micro-interaction for subtle entrance animation
        document.addEventListener('DOMContentLoaded', () => {
            const logo = document.querySelector('.glass-panel');
            const text = document.querySelector('h1');
            const subtext = document.querySelector('p');
            
            logo.style.opacity = '0';
            logo.style.transform = 'scale(0.95) translateY(20px)';
            logo.style.transition = 'all 1s cubic-bezier(0.16, 1, 0.3, 1)';
            
            text.style.opacity = '0';
            text.style.transform = 'translateY(10px)';
            text.style.transition = 'all 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s';
            
            subtext.style.opacity = '0';
            subtext.style.transform = 'translateY(10px)';
            subtext.style.transition = 'all 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s';
            
            setTimeout(() => {
                logo.style.opacity = '1';
                logo.style.transform = 'scale(1) translateY(0)';
                
                text.style.opacity = '1';
                text.style.transform = 'translateY(0)';
                
                subtext.style.opacity = '1';
                subtext.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
</body></html>
